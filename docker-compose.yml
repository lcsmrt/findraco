services:
  findraco-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: findraco-api
    container_name: findraco-api
    # Host networking: the PostgreSQL instance only listens on the VPS's
    # localhost, so the API shares that localhost. It exposes port 3000 there.
    network_mode: host
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Where the API listens: the docker0 gateway, never a public address (see DEPLOY.md). No default on
      # purpose: an unset value must stop the deploy instead of binding the API publicly.
      - SERVER_ADDRESS=${SERVER_ADDRESS:?set SERVER_ADDRESS to the docker0 gateway, see DEPLOY.md}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - APP_URL=${APP_URL}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@findraco.local}
    restart: unless-stopped

  findraco-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: findraco-web
    container_name: findraco-web
    # The only publicly exposed port: nginx serves the SPA and proxies /api to
    # the API on the host (see frontend/nginx.conf).
    ports:
      - "${WEB_PORT:-5000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - findraco-api
    restart: unless-stopped
