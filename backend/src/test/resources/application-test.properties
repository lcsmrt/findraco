# Test profile — the *IT suite runs against the local dev database (dev_finsight),
# reached over the SSH tunnel on localhost:5432. There is no separate test DB:
# dev_finsight IS the throwaway test database now that the real data lives in prod.
#
# The datasource is deliberately NOT overridden here — application.properties'
# ${SPRING_DATASOURCE_*} placeholders resolve from backend/.env like they do for a
# normal run, so the tunnel must be up and .env must exist or the context fails to
# start. AbstractIntegrationTest refuses to run against any database not on its
# disposable-database allowlist, because every test truncates the whole schema.

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

jwt.secret-key=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWludGVncmF0aW9uLXRlc3RzLW5vdC1mb3ItcHJvZA==

spring.devtools.restart.enabled=false
