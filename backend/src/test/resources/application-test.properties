# The datasource comes from the Postgres container in TestcontainersConfig (@ServiceConnection).

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

ALLOWED_ORIGINS=http://localhost:5173

app.jwt.secret-key=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWludGVncmF0aW9uLXRlc3RzLW5vdC1mb3ItcHJvZA==

spring.devtools.restart.enabled=false

# Statement counts for StatementCountIT; the per-session summary Hibernate would log stays quiet.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF

# Generous limits so no test is throttled by accident; the rate-limit ITs set tight ones themselves.
app.rate-limit.login-ip.capacity=100000
app.rate-limit.login-ip.period=PT1M
app.rate-limit.login-email.capacity=100000
app.rate-limit.login-email.period=PT1M
app.rate-limit.forgot-email.capacity=100000
app.rate-limit.forgot-email.period=PT1H
app.rate-limit.forgot-ip.capacity=100000
app.rate-limit.forgot-ip.period=PT1H
app.rate-limit.register-ip.capacity=100000
app.rate-limit.register-ip.period=PT1H
app.rate-limit.import-user.capacity=100000
app.rate-limit.import-user.period=PT1H

# No scheduled or startup top-up in tests: ITs call the job themselves.
app.series.top-up-cron=-
