spring.application.name=findraco

# Substituted at build time from the Maven project version (single source of truth).
app.version=@project.version@

spring.dotenv.filename=.env.${spring.profiles.active:.local}

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FLYWAY (schema migrations)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# JWT CONFIG
# ===============================
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# PASSWORD RECOVERY EMAIL
# ===============================
# Base URL of the SPA, used to build the reset link sent by email.
app.url=${APP_URL:http://localhost:5173}
# SMTP is optional: without SMTP_HOST the reset link is logged instead of sent.
app.mail.smtp-host=${SMTP_HOST:}
app.mail.smtp-port=${SMTP_PORT:587}
app.mail.smtp-username=${SMTP_USERNAME:}
app.mail.smtp-password=${SMTP_PASSWORD:}
app.mail.from=${SMTP_FROM:no-reply@findraco.local}

# ===============================
# SERVER
# ===============================
server.http2.enabled=true
server.port=${SERVER_PORT:3000}

# ===============================
# FILE UPLOAD CONFIG
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# DOCS
# ===============================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
