spring.application.name=findraco

# Substituted at build time from the Maven project version (single source of truth).
app.version=@project.version@

# Local runs read backend/.env when present; real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=com.lcs.findraco.shared.config.QuotedSnakeCaseNamingStrategy
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FLYWAY (schema migrations)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# JWT CONFIG
# ===============================
app.jwt.secret-key=${JWT_SECRET_KEY}
# Access token lifetime in milliseconds: 15 minutes. The session cookie renews it.
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}

# ===============================
# CORS
# ===============================
# Comma-separated origins of the SPA.
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# ===============================
# SESSIONS
# ===============================
# A session expires after this long without a renewal; each renewal restarts it.
app.session.ttl=P30D
# A replaced session token presented again within this window still renews (concurrent tabs,
# lost responses); later, it is treated as stolen and its device chain is revoked.
app.session.reuse-grace=PT30S
# The session cookie is sent over HTTPS only. Set SESSION_COOKIE_SECURE=false only for a
# browser that refuses Secure cookies on plain-HTTP localhost.
app.session.cookie-secure=${SESSION_COOKIE_SECURE:true}

# ===============================
# PASSWORD RECOVERY EMAIL
# ===============================
# Base URL of the SPA, used to build the reset link sent by email.
app.url=${APP_URL:http://localhost:5173}
# SMTP is optional: without SMTP_HOST the reset link is logged instead of sent.
app.mail.smtp-host=${SMTP_HOST:}
app.mail.smtp-port=${SMTP_PORT:587}
app.mail.smtp-username=${SMTP_USER:}
app.mail.smtp-password=${SMTP_PASS:}
app.mail.from=${SMTP_FROM:no-reply@findraco.local}

# ===============================
# SERVER
# ===============================
server.http2.enabled=true
server.port=${SERVER_PORT:3000}

# ===============================
# FILE UPLOAD CONFIG
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# DOCS
# ===============================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
