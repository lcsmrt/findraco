spring.application.name=findraco

# Substituted at build time from the Maven project version (single source of truth).
app.version=@project.version@

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
# SQL echo is for a developer's own run only (application-local.properties).
spring.jpa.show-sql=false
# Every database access happens inside a service transaction; responses are built there.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=com.lcs.findraco.shared.config.QuotedSnakeCaseNamingStrategy
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FLYWAY (schema migrations)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# JWT CONFIG
# ===============================
# Base64 text of at least 32 random bytes (openssl rand -base64 48); the app refuses to start otherwise.
app.jwt.secret-key=${JWT_SECRET_KEY}
# Access token lifetime in milliseconds: 15 minutes. The session cookie renews it.
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}

# ===============================
# CORS
# ===============================
# Comma-separated origins of the SPA.
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# ===============================
# SESSIONS
# ===============================
# A session expires after this long without a renewal; each renewal restarts it.
app.session.ttl=P30D
# A replaced session token presented again within this window still renews (concurrent tabs,
# lost responses); later, it is treated as stolen and its device chain is revoked.
app.session.reuse-grace=PT30S
# The session cookie is sent over HTTPS only. Set SESSION_COOKIE_SECURE=false only for a
# browser that refuses Secure cookies on plain-HTTP localhost.
app.session.cookie-secure=${SESSION_COOKIE_SECURE:true}

# ===============================
# RATE LIMITS
# ===============================
# At most `capacity` calls per key in each `period`, in memory (one application instance). Every
# rule is required: a missing one fails startup instead of leaving a route unlimited. Over the limit
# the API answers 429 with Retry-After.
app.rate-limit.login-ip.capacity=20
app.rate-limit.login-ip.period=PT1M
app.rate-limit.login-email.capacity=5
app.rate-limit.login-email.period=PT1M
app.rate-limit.forgot-email.capacity=3
app.rate-limit.forgot-email.period=PT1H
app.rate-limit.forgot-ip.capacity=10
app.rate-limit.forgot-ip.period=PT1H
app.rate-limit.register-ip.capacity=5
app.rate-limit.register-ip.period=PT1H
app.rate-limit.import-user.capacity=10
app.rate-limit.import-user.period=PT1H

# ===============================
# PASSWORD RECOVERY EMAIL
# ===============================
# Base URL of the SPA, used to build the reset link sent by email.
app.url=${APP_URL:http://localhost:5173}
# SMTP is optional: without SMTP_HOST the reset link is logged instead of sent.
app.mail.smtp-host=${SMTP_HOST:}
app.mail.smtp-port=${SMTP_PORT:587}
app.mail.smtp-username=${SMTP_USER:}
app.mail.smtp-password=${SMTP_PASS:}
app.mail.from=${SMTP_FROM:no-reply@findraco.local}
# Mail is sent off the request thread on a bounded pool; beyond coreSize + queueCapacity the pool grows to
# maxSize, and beyond that a message is dropped and logged.
app.mail.executor.core-size=2
app.mail.executor.max-size=4
app.mail.executor.queue-capacity=100

# ===============================
# SERVER
# ===============================
server.http2.enabled=true
server.port=${SERVER_PORT:3000}
# Listen only where the reverse proxy reaches. Local runs stay on loopback; production sets SERVER_ADDRESS
# to the docker0 gateway (see DEPLOY.md), so port 3000 does not answer on the public IP.
server.address=${SERVER_ADDRESS:127.0.0.1}
# X-Forwarded-For is honoured only from the proxies listed here (loopback and Docker's private range);
# from any other address it is ignored, so a client reaching the API cannot forge its IP.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}

# Validation messages and problem details are English, whatever the caller's or the machine's locale.
spring.web.locale=en
spring.web.locale-resolver=fixed

# ===============================
# FILE UPLOAD CONFIG
# ===============================
# The container's hard stop sits above app.import.max-bytes, so a file just over the bound still reaches
# the service and is answered with the typed csv-too-large problem; only a far larger upload is cut here.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Bank file import bounds: file size in bytes, data rows, and invalid lines listed in the answer.
app.import.max-bytes=1048576
app.import.max-rows=5000
app.import.max-errors=50

# ===============================
# RECURRING SERIES
# ===============================
# Open-ended series are generated this many months ahead. A daily job (and one run at startup, for
# downtime) tops them up; `-` turns the schedule and the startup run off.
app.series.horizon-months=12
app.series.top-up-cron=0 30 3 * * *

# ===============================
# DOCS
# ===============================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.default-produces-media-type=application/json

# ===============================
# LOCAL .env
# ===============================
# Local runs read backend/.env when present; real environment variables take precedence. Tests never
# read it, so they behave as in CI and never reach the developer's real SMTP server. (The document
# separator below must not touch a comment line.)

#---
spring.config.activate.on-profile=!test
spring.config.import=optional:file:.env[.properties]
