# The API builds nothing from these (the authorization server redirects to OAUTH_ISSUER), but the scheme it sees should
# be the user's, not this hop's. TLS ends in front of this container, so the terminator's X-Forwarded-Proto is passed
# through and $scheme is only the fallback for a direct http hit.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $forwarded_proto $forwarded_port {
  https 443;
  default 80;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Matches spring.servlet.multipart.max-file-size in the API (50MB); nginx would
  # otherwise reject uploads with 413 before they ever reach the backend.
  client_max_body_size 50m;

  # The API runs with network_mode: host, so it is reachable on the host's port
  # 3000. Proxying keeps the browser same-origin: no CORS, no IP baked into the
  # bundle. /api/findraco/... reaches the API unchanged.
  location /api/ {
    proxy_pass http://host.docker.internal:3000/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }

  # The authorization server (sign-in post, authorize, token, client-info) and the discovery documents
  # Claude fetches live in the API; the path is preserved because the issuer is this origin.
  location /oauth2/ {
    proxy_pass http://host.docker.internal:3000/oauth2/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }

  location /.well-known/ {
    proxy_pass http://host.docker.internal:3000/.well-known/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }

  # MCP over Streamable HTTP: a response may be an event stream that stays open, so nginx must not
  # buffer or cache it, nor cut it at the default 60s read timeout.
  location /mcp {
    proxy_pass http://host.docker.internal:3000/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }

  # The shell and the files that decide when it is replaced must revalidate on every load, or an
  # installed app keeps running yesterday's worker. The SPA fallback below is an internal redirect to
  # /index.html, so it lands in the first block and needs no header of its own.
  # add_header in a location replaces the ones inherited from the server block; there are none here.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /version.json {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types {
      application/manifest+json webmanifest;
    }
  }

  # Vite hashes every file name here, so a cached copy is never stale.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
