server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Matches spring.servlet.multipart.max-file-size in the API (50MB); nginx would
  # otherwise reject uploads with 413 before they ever reach the backend.
  client_max_body_size 50m;

  # The API runs with network_mode: host, so it is reachable on the host's port
  # 3000. Proxying keeps the browser same-origin: no CORS, no IP baked into the
  # bundle. /api/findraco/... reaches the API unchanged.
  location /api/ {
    proxy_pass http://host.docker.internal:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The shell and the files that decide when it is replaced must revalidate on every load, or an
  # installed app keeps running yesterday's worker. The SPA fallback below is an internal redirect to
  # /index.html, so it lands in the first block and needs no header of its own.
  # add_header in a location replaces the ones inherited from the server block; there are none here.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /version.json {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types {
      application/manifest+json webmanifest;
    }
  }

  # Vite hashes every file name here, so a cached copy is never stale.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
