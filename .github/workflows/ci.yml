name: CI

on:
  push:
  workflow_dispatch:
  # A push tests only what it can break; the weekly run on main tests everything, so a test the
  # import graph misses still runs. A failure ends the run red, which GitHub reports by email.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Path filters live here, not in `on:`: GitHub applies them per workflow, so
  # they could not skip one app while still gating the deploy on the other.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
      deployable: ${{ steps.diff.outputs.deployable }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The diff runs from the last green run on this branch, not from the
      # previous push: after a failed run, the next push must still test what
      # that run failed on, or untested code would ride along with it into the
      # deploy. Without a usable base (dispatch, first run, force push) every
      # app runs, so the safe default is always a full run.
      - name: Decide which apps this push changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          frontend=true
          backend=true
          base=""
          usable_base=""
          if [[ "$EVENT" == push ]]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BRANCH" \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          if [[ -n "$base" ]] && git merge-base --is-ancestor "$base" "$GITHUB_SHA" 2>/dev/null; then
            usable_base=$base
            frontend=false
            backend=false
            # Docs touch no app; anything outside both apps (root config, the
            # lockfile, this workflow, compose files) may affect either.
            while IFS= read -r file; do
              case "$file" in
                .specs/*|.claude/*|*.md) ;;
                frontend/*) frontend=true ;;
                backend/*) backend=true ;;
                *) frontend=true; backend=true ;;
              esac
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
          fi
          deployable=false
          if [[ "$frontend" == true || "$backend" == true ]]; then deployable=true; fi
          echo "base=${base:-none} frontend=$frontend backend=$backend deployable=$deployable"
          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "deployable=$deployable"
            echo "base=$usable_base"
          } >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      # Full history: the affected test run diffs against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node@v5 caches the package manager named in package.json by default, which fails
          # before corepack enables pnpm; the pnpm store cache below handles caching instead.
          package-manager-cache: false

      # pnpm version comes from the root package.json "packageManager" field.
      - name: Enable pnpm
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      # The storybook project runs every story in Chromium. The cache is keyed on the installed
      # Playwright version, so a version bump downloads the browser that version expects.
      - name: Read the Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # The cache holds the browser only; its system libraries are apt packages.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      # With a usable base, only the tests importing a changed file run; a change to a file tests
      # depend on without importing it reruns everything (`forceRerunTriggers`). Without a base
      # (dispatch, schedule, first run, force push) the full suite runs. Either way the sibling gate
      # covers the whole tree and the critical modules are measured by their own tests. Tooling runs
      # whole: `--changed` mistakes its `eslint` package import for the `eslint/` folder and fails.
      - name: Test
        working-directory: frontend
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE" ]]; then
            pnpm test
            exit 0
          fi
          node scripts/check-siblings.ts
          pnpm exec vitest run --changed "$BASE" --passWithNoTests --project=unit --project=storybook
          pnpm exec vitest run --project=tooling
          pnpm exec vitest run --project=critical --coverage

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Every *Test (surefire), every *IT (failsafe, on a Testcontainers Postgres through the
      # runner's Docker) and the JaCoCo gate. A failure here keeps deploy from running.
      - name: Test
        working-directory: backend
        run: ./mvnw -B verify

  deploy:
    needs: [changes, frontend, backend]
    # A skipped app job would skip this one by default; `!cancelled()` lets it
    # run, and each app must have passed or been skipped as unchanged.
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.deployable == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.frontend.result)
      && contains(fromJSON('["success", "skipped"]'), needs.backend.result)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Portainer instance IDs/URL — not sensitive. Only the API token is a secret.
    env:
      PORTAINER_URL: https://portainer.lcsmrt.com
      STACK_ID: "74"
      ENDPOINT_ID: "3"
    steps:
      - uses: actions/checkout@v7

      # Portainer builds whatever main is when called, not this commit. If main
      # moved on, the newer commit's pipeline tests and deploys it instead.
      - name: Check that this commit is still the tip of main
        id: head
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: $GITHUB_SHA is no longer the tip of main ($tip)."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull and redeploy the stack
        if: steps.head.outputs.current == 'true'
        env:
          API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail

          [[ "$STACK_ID" =~ ^[0-9]+$ ]] || {
            echo "STACK_ID is still a placeholder. Open the stack in Portainer and"
            echo "copy the id from the URL (…/docker/stacks/findraco?id=<STACK_ID>…)."
            exit 1
          }

          # A plain stack webhook only recreates the containers from the image that
          # was already built, so the new code never ships. git/redeploy is what the
          # "Pull and redeploy" button calls: it re-pulls the repo and rebuilds.
          #
          # The stack's current Env is read back and sent unchanged, so the database
          # password and JWT secret stay in Portainer and are never copied into
          # GitHub — and the PUT does not wipe them.
          #
          # Retries: the VPS may be busy with a build and not answer right away.
          env_json=$(curl -fsS \
            --connect-timeout 20 --max-time 60 --retry 4 --retry-delay 10 --retry-all-errors \
            -H "X-API-Key: $API_KEY" \
            "$PORTAINER_URL/api/stacks/$STACK_ID" | jq '.Env // []')

          body=$(jq -cn --argjson env "$env_json" '{
            env: $env,
            prune: false,
            PullImage: false,
            RepositoryReferenceName: "refs/heads/main",
            RepositoryAuthentication: false
          }')

          # Generous timeout: this rebuilds both images (Maven + pnpm) on the VPS.
          # The response is the full stack, Env included (DB password, JWT secret,
          # SMTP password) — never let it reach the public job log.
          curl -fsS -o /dev/null -X PUT \
            --connect-timeout 20 --max-time 900 --retry 4 --retry-delay 15 --retry-all-errors \
            -H "X-API-Key: $API_KEY" \
            -H 'Content-Type: application/json' \
            "$PORTAINER_URL/api/stacks/$STACK_ID/git/redeploy?endpointId=$ENDPOINT_ID" \
            --data "$body"
