# One weekly pull request per ecosystem for minor and patch updates. A major update arrives in its own
# pull request: it may need a migration, and a failure in a grouped one cannot be traced to its package.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The pnpm workspace: root package.json and pnpm-lock.yaml cover backend/ and frontend/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Packages released in lockstep only work at the same major, so their majors come together.
      storybook-major:
        patterns: ["storybook", "@storybook/*", "eslint-plugin-storybook", "@chromatic-com/storybook"]
        update-types: ["major"]
      vitest-major:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
      eslint-major:
        patterns: ["eslint", "@eslint/*"]
        update-types: ["major"]
    ignore:
      # The types follow the Node major CI and production run (24), not the latest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet; lift once it does.
      - dependency-name: "typescript"
        versions: [">=7"]
      # 2.0.8 breaks the AuthProvider toast tests (a toast seen where none or one is expected); hold it
      # until it is known whether that is a real duplicate toast or state leaking between tests.
      - dependency-name: "sonner"
        versions: ["2.0.8"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
